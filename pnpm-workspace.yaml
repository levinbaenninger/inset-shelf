packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - electron@45.0.0
  - vite@8.3.5
allowBuilds:
  electron-winstaller: false
  # Both install scripts only pick the bundled prebuilds.
  get-windows: true
  uiohook-napi: true
  # wrangler's bundler and its local runtime: both install scripts only pick a prebuilt binary.
  esbuild: true
  workerd: true
