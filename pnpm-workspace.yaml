packages:
  - apps/*
  - packages/*
minimumReleaseAgeExclude:
  - electron@45.0.0
allowBuilds:
  electron-winstaller: false
  # Both install scripts only pick the bundled prebuilds.
  get-windows: true
  uiohook-napi: true
  # wrangler's bundler and its local runtime: both install scripts only pick a prebuilt binary.
  esbuild: true
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
