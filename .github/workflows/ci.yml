name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, build
    permissions:
      checks: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: true
      - run: vp check
      - run: vp run typecheck
      - run: vp test
      - run: vp run build
      - name: Verify website preview
        if: github.event_name == 'pull_request'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-website-preview.sh "$BASE_SHA" "$HEAD_SHA"

  package:
    name: Package (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: package:mac
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
          - name: Windows
            os: windows-latest
            script: package:win
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: true
      - run: vp run ${{ matrix.script }}
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v7
        with:
          name: inset-shelf-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
