name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: package:mac
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest*.yml
          - name: Windows
            os: windows-latest
            script: package:win
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest*.yml
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # An ad-hoc build in the feed could never install over a signed one.
      INSET_REQUIRE_SIGNING: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: 24
          cache: true
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p 'require("./apps/desktop/package.json").version')" = "$GITHUB_REF_NAME"
      - name: Stamp the build version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          base="$(node -p 'require("./apps/desktop/package.json").version')"
          echo "VERSION_ARGS=-c.extraMetadata.version=${base%.*}.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Import the signing identity
        if: runner.os == 'macOS'
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$(ADD_TO_SEARCH_LIST=1 apps/desktop/scripts/import-signing-key.sh "$RUNNER_TEMP")"
          echo "INSET_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - shell: bash
        working-directory: apps/desktop
        run: vp run ${{ matrix.script }} ${VERSION_ARGS:+"$VERSION_ARGS"}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish
    needs: package
    # A manual run from another branch only packages; releases come from main and v* tags.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Pin the feed and add the stable installer names
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' dist/latest-mac.yml)"
          test "$(sed -n 's/^version: //p' dist/latest.yml)" = "$version"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$tag" = "$GITHUB_REF_NAME"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

          .github/scripts/pin-feed-urls.sh \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag" \
            dist/latest-mac.yml dist/latest.yml
          # The site links these names under /releases/latest/download. The feed doesn't name them.
          for target in mac-arm64.dmg mac-x64.dmg win-x64.exe; do
            cp "dist/inset-shelf-$version-$target" "dist/Inset-Shelf-$target"
          done
      # Installed apps read latest*.yml from /releases/latest/download, so the
      # release stays a draft until every file is up. A tag build is never Latest:
      # main already built that commit under a higher <major>.<minor>.<run number>.
      - name: Publish the versioned release
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            create=(--verify-tag)
            latest=false
          else
            create=(--target "$GITHUB_SHA")
            latest=true
          fi

          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null || echo missing)"
          case "$draft" in
            false)
              echo "$TAG is already published."
              exit 0
              ;;
            missing)
              gh release create "$TAG" "${create[@]}" \
                --draft \
                --title "Inset Shelf $TAG" \
                --notes-file .github/release-notes.md
              ;;
          esac
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest="$latest"
      # Apps installed from a preview build read latest*.yml from this release.
      # It now carries only those files, pinned to the versioned release published
      # above. The files the previous feed named by bare name stay one more build,
      # for apps that read it just before the switch.
      - name: Point the legacy preview feed at the release
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          if ! gh release view preview > /dev/null 2>&1; then
            echo "No preview release, so no app reads the legacy feed."
            exit 0
          fi

          previous="$(mktemp)"
          for feed in latest-mac.yml latest.yml; do
            gh release download preview --pattern "$feed" --output - 2> /dev/null || true
          done | sed -n -e 's/^ *- url: //p' > "$previous"

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/preview" \
            -f sha="$GITHUB_SHA" -F force=true > /dev/null
          gh release upload preview dist/latest*.yml --clobber
          gh release view preview --json assets --jq '.assets[].name' \
            | while read -r name; do
                case "$name" in
                  latest*.yml) continue ;;
                esac
                grep -qxF "${name%.blockmap}" "$previous" \
                  || gh release delete-asset preview "$name" --yes
              done
          gh release edit preview \
            --title "Legacy update feed (main, ${GITHUB_SHA::7})" \
            --notes-file .github/preview-notes.md \
            --prerelease
