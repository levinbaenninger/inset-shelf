name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: package:mac
            files: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/latest*.yml
          - name: Windows
            os: windows-latest
            script: package:win
            files: |
              release/*.exe
              release/*.zip
              release/*.blockmap
              release/latest*.yml
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # An ad-hoc build in the feed could never install over a signed one.
      INSET_REQUIRE_SIGNING: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Stamp the preview version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          base="$(node -p 'require("./package.json").version')"
          echo "VERSION_ARGS=-c.extraMetadata.version=${base%.*}.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Import the signing identity
        if: runner.os == 'macOS'
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$(ADD_TO_SEARCH_LIST=1 scripts/import-signing-key.sh "$RUNNER_TEMP")"
          echo "INSET_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - shell: bash
        run: pnpm ${{ matrix.script }} $VERSION_ARGS
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Inset Shelf $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --verify-tag
      # Installed apps read latest*.yml from this release, so it is updated in
      # place: new files first, then the feed files. The files the previous feed
      # named stay one more build, for apps that read it just before the switch.
      - name: Publish rolling preview from main
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          title="Preview build (main, ${GITHUB_SHA::7})"

          if ! gh release view preview > /dev/null 2>&1; then
            gh release create preview dist/* \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file .github/release-notes.md \
              --prerelease
            exit 0
          fi

          previous="$(mktemp)"
          for feed in latest-mac.yml latest.yml; do
            gh release download preview --pattern "$feed" --output - 2> /dev/null || true
          done | sed -n -e 's/^ *- url: //p' > "$previous"

          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/preview" \
            -f sha="$GITHUB_SHA" -F force=true > /dev/null
          find dist -type f ! -name 'latest*.yml' -print0 \
            | xargs -0 gh release upload preview --clobber
          gh release upload preview dist/latest*.yml --clobber
          gh release view preview --json assets --jq '.assets[].name' \
            | while read -r name; do
                [ -e "dist/$name" ] || grep -qxF "${name%.blockmap}" "$previous" \
                  || gh release delete-asset preview "$name" --yes
              done
          gh release edit preview \
            --title "$title" \
            --notes-file .github/release-notes.md \
            --prerelease
