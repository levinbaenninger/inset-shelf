name: Release

# Signing and publishing happen only for pushed v* tags. Pushes to main and pull
# requests are built and tested by ci.yml, which never sees the signing key.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.name }})
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS
            os: macos-latest
            script: package:mac
            files: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest*.yml
          - name: Windows
            os: windows-latest
            script: package:win
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.zip
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest*.yml
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # An ad-hoc build in the feed could never install over a signed one.
      INSET_REQUIRE_SIGNING: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24
          cache: true
      - name: Check tag matches package version
        shell: bash
        run: test "v$(node -p 'require("./apps/desktop/package.json").version')" = "$GITHUB_REF_NAME"
      # The signing key is given only to this step, only on macOS, only for a v* tag.
      # The job still runs third-party setup actions before it, so the key lands in a
      # temporary keychain that exists for the rest of this single-use runner.
      - name: Import the signing identity
        if: runner.os == 'macOS'
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$(ADD_TO_SEARCH_LIST=1 apps/desktop/scripts/import-signing-key.sh "$RUNNER_TEMP")"
          echo "INSET_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - shell: bash
        working-directory: apps/desktop
        run: vp run ${{ matrix.script }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish
    needs: package
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that can write to the repository. It never sees the signing key.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Pin the feed and add the stable installer names
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: //p' dist/latest-mac.yml)"
          test "$(sed -n 's/^version: //p' dist/latest.yml)" = "$version"
          tag="v$version"
          test "$tag" = "$GITHUB_REF_NAME"
          echo "TAG=$tag" >> "$GITHUB_ENV"

          .github/scripts/pin-feed-urls.sh \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag" \
            dist/latest-mac.yml dist/latest.yml
          # The site links these names under /releases/latest/download. The feed doesn't name them.
          for target in mac-arm64.dmg mac-x64.dmg win-x64.exe; do
            cp "dist/inset-shelf-$version-$target" "dist/Inset-Shelf-$target"
          done
      # Covers every asset as uploaded, after the feed files were rewritten.
      - name: Write SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | sed 's#^\./##' | LC_ALL=C sort \
            | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Installed apps read latest*.yml from /releases/latest/download, so the
      # release stays a draft until every file is up. It becomes Latest only if its
      # version is newer than the current Latest, so re-running an old tag never
      # moves Latest backwards.
      - name: Publish the versioned release
        run: |
          set -euo pipefail
          # Only "no release yet" counts as no Latest; any other error stops here.
          if ! current="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> "$RUNNER_TEMP/latest.err")"; then
            grep -q 'HTTP 404' "$RUNNER_TEMP/latest.err" || { cat "$RUNNER_TEMP/latest.err" >&2; exit 1; }
            current=""
          fi
          newest="$(printf '%s\n%s\n' "${current#v}" "${TAG#v}" | sort -V | tail -n 1)"
          if [ "$newest" = "${TAG#v}" ]; then
            latest=true
          else
            echo "$current is newer than $TAG, so $TAG is not marked Latest."
            latest=false
          fi

          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null || echo missing)"
          case "$draft" in
            false)
              echo "$TAG is already published."
              exit 0
              ;;
            missing)
              gh release create "$TAG" --verify-tag \
                --draft \
                --title "Inset Shelf $TAG" \
                --notes-file .github/release-notes.md
              ;;
          esac
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false --latest="$latest"
