name: Feature request
description: Suggest a change to the desktop app or website.
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the task and how you handle it today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would make that task easier?
    validations:
      required: true
