appId: ch.inset.prototype.shelf
productName: Inset Shelf
artifactName: inset-shelf-${version}-${os}-${arch}.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - "*.png"
asar: true
# Native modules and helper binaries cannot load from inside the asar.
asarUnpack:
  - "**/node_modules/uiohook-napi/**"
  - "**/node_modules/get-windows/**"
npmRebuild: false
afterSign: scripts/sign-mac.ts
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # scripts/sign-mac.ts signs with the shared self-signed identity, which electron-builder refuses.
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSAccessibilityUsageDescription: Inset Shelf reads your text selection when you tap Shift twice.
    NSAppleEventsUsageDescription: Inset Shelf saves the address of the page you capture from, so you can open it again.
    NSDesktopFolderUsageDescription: Inset Shelf shows new screenshots saved to your Desktop beside the shelf.
    NSDocumentsFolderUsageDescription: Inset Shelf shows new screenshots saved to your Documents folder beside the shelf.
dmg:
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# Writes latest*.yml and the app's feed; CI uploads them to the rolling preview release.
publish:
  provider: generic
  url: https://github.com/levinbaenninger/inset-shelf/releases/download/preview
